<!doctype html>

<html lang="id">
<head>
    <meta charset="utf-8"><title>Mengalihkan ke Sobat Komputer</title>

<!-- Redirect otomatis jika JavaScript tidak aktif -->
<meta
    http-equiv="refresh"
    content="0; url=https://sobatkomputer.github.io/"
>

<!-- Alamat halaman utama -->
<link
    rel="canonical"
    href="https://sobatkomputer.github.io/"
>

<!-- Halaman redirect tidak perlu masuk hasil pencarian -->
<meta name="robots" content="noindex, follow">

<script>
    // Alihkan tanpa menambah riwayat browser
    window.location.replace("https://sobatkomputer.github.io/");
</script>

</head><body>
    <p>
        Anda sedang dialihkan ke
        <a href="https://sobatkomputer.github.io/">
            sobatkomputer.github.io
        </a>.
    </p>
</body>
</html>
